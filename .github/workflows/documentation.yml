name: Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Build documentation
      run: |
        swift package --allow-writing-to-directory docs-out \
          generate-documentation --target CoreOSC \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path CoreOSC \
          --output-path docs-out
    - name: Redirect root to the landing page
      run: |
        cat > docs-out/index.html <<'HTML'
        <!DOCTYPE html>
        <html>
        <head><meta http-equiv="refresh" content="0; url=documentation/coreosc/"></head>
        <body><a href="documentation/coreosc/">CoreOSC Documentation</a></body>
        </html>
        HTML
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs-out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
